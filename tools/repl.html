<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra 互動式環境 (REPL v1.4)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code,Inter,monospace,Noto+Serif+TC&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .repl-container {
            font-family: 'Fira Code', monospace;
            background-color: #1a1b26;
            color: #a9b1d6;
        }
        .repl-input {
            background: transparent;
            border: none;
            outline: none;
            color: #a9b1d6;
            width: 100%;
        }
        .prompt {
            color: #bb9af7;
        }
        .output-line {
            white-space: pre-wrap;
            word-break: break-all;
        }
        .output-result {
            color: #7dcfff;
        }
        .output-error {
            color: #f7768e;
        }
        .output-whisper {
            color: #e0af68; /* 溫暖的琥珀色 */
            font-family: 'Noto Serif TC', serif; /* 使用襯線字體增加文藝感 */
            padding-left: 1rem;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen p-4">

    <div class="w-full max-w-4xl h-[80vh] flex flex-col rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-gray-700 p-3 flex items-center">
            <div class="flex space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
            <p class="text-center text-gray-300 text-sm flex-grow">Lyra REPL v1.4 - The Poet's Error</p>
        </div>

        <div id="repl-output" class="repl-container p-4 flex-grow overflow-y-auto">
            <!-- 初始歡迎訊息會由 JS 動態加入 -->
        </div>
        <div class="repl-container p-2 border-t border-gray-700">
            <div class="flex items-center">
                <span class="prompt mr-2">&gt;</span>
                <input type="text" id="repl-input" class="repl-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <script type="module">
        // --- 引擎：Lyra Core Engine ---

        class LyraError extends Error {
            constructor(directMessage, whisper) {
                super(directMessage);
                this.name = 'LyraError';
                this.whisper = whisper;
            }
        }

        // 1. Lexer (詞法分析器)
        const TokenType = { KEYWORD: '關鍵字', IDENTIFIER: '識別符', STRING: '文字', NUMBER: '數字', OPERATOR: '運算符', PUNCTUATION: '標點符號', EOF: '檔案結尾' };
        const KEYWORDS = {'define': 1, 'say': 1, 'when': 1, 'else': 1, 'end': 1, 'is': 1, 'repeat': 1, 'from': 1, 'to': 1, 'a': 1, 'list': 1, 'of': 1, 'at': 1, 'for': 1, 'each': 1, 'in': 1, 'count': 1, 'add': 1, 'remove': 1, 'item': 1, 'length': 1, 'uppercase': 1, 'lowercase': 1, 'split': 1, 'by': 1, 'round': 1};
        class Token { constructor(type, value, line) { this.type = type; this.value = value; this.line = line; } }
        function tokenize(code) {
            const tokens = []; let current = 0; let line = 1;
            while (current < code.length) {
                let char = code[current];
                if (/\s/.test(char)) { if (char === '\n') line++; current++; continue; }
                if (char === '#') { while (current < code.length && code[current] !== '\n') current++; continue; }
                if (char === '(' || char === ')' || char === ',') { tokens.push(new Token(TokenType.PUNCTUATION, char, line)); current++; continue; }
                if (/[+\-*/]/.test(char)) { tokens.push(new Token(TokenType.OPERATOR, char, line)); current++; continue; }
                if (char === '"') { let value = ''; current++; while (current < code.length && code[current] !== '"') { value += code[current]; current++; } current++; tokens.push(new Token(TokenType.STRING, value, line)); continue; }
                if (/\d/.test(char)) { let value = ''; while (current < code.length && /[0-9.]/.test(code[current])) { value += code[current]; current++; } tokens.push(new Token(TokenType.NUMBER, parseFloat(value), line)); continue; }
                if (/[a-zA-Z_]/.test(char)) { let value = ''; while (current < code.length && /[a-zA-Z0-9_]/.test(code[current])) { value += code[current]; current++; } const type = KEYWORDS[value] ? TokenType.KEYWORD : TokenType.IDENTIFIER; tokens.push(new Token(type, value, line)); continue; }
                throw new Error(`無法識別的字元 '${char}' 在第 ${line} 行。`);
            }
            tokens.push(new Token(TokenType.EOF, 'EOF', line)); return tokens;
        }

        // 2. Parser (語法分析器)
        class Parser {
            constructor(tokens) { this.tokens = tokens; this.current = 0; }
            parse() { const stmts = []; while (!this.isAtEnd()) { stmts.push(this.parseStatement()); } return { type: 'Program', body: stmts }; }
            parseStatement() {
                if (this.check(TokenType.IDENTIFIER) && this.peekNext().value === 'is') return this.parseAssignmentStatement();
                if (this.match(TokenType.KEYWORD, 'say')) return this.parseSayStatement();
                if (this.match(TokenType.KEYWORD, 'repeat')) return this.parseRepeatStatement();
                if (this.match(TokenType.KEYWORD, 'add')) return this.parseAddStatement();
                if (this.match(TokenType.KEYWORD, 'remove')) return this.parseRemoveStatement();
                return this.parseExpressionStatement();
            }
            parseExpressionStatement() { const expr = this.parseExpression(); return { type: 'ExpressionStatement', expression: expr }; }
            parseRemoveStatement() { this.consume(TokenType.KEYWORD, 'item', "在 'remove' 後面需要 'item'。"); this.consume(TokenType.KEYWORD, 'at', "在 'item' 後面需要 'at'。"); const index = this.parseExpression(); this.consume(TokenType.KEYWORD, 'from', "在索引後需要 'from'。"); const listName = this.consume(TokenType.IDENTIFIER, null, "在 'from' 後面需要列表名稱。"); return { type: 'RemoveStatement', index, list: listName.value }; }
            parseAddStatement() { const value = this.parseExpression(); this.consume(TokenType.KEYWORD, 'to', "在 'add' 的值後面需要 'to'。"); const listName = this.consume(TokenType.IDENTIFIER, null, "在 'to' 後面需要列表名稱。"); return { type: 'AddStatement', value, list: listName.value }; }
            parseAssignmentStatement() { const name = this.consume(TokenType.IDENTIFIER, null, "需要變數名稱。"); this.consume(TokenType.KEYWORD, 'is', "變數名稱後需要 'is'。"); const value = this.parseExpression(); return { type: 'AssignmentStatement', name: name.value, value }; }
            parseRepeatStatement() {
                if (this.match(TokenType.KEYWORD, 'for')) { this.consume(TokenType.KEYWORD, 'each', "在 'for' 後面需要 'each'。"); const variable = this.consume(TokenType.IDENTIFIER, null, "需要項目變數名稱。"); this.consume(TokenType.KEYWORD, 'in', "需要 'in' 關鍵字。"); const collection = this.parseExpression(); const body = this.parseBlock(); return { type: 'ForEachStatement', variable: variable.value, collection, body }; } 
                else if (this.check(TokenType.IDENTIFIER) && this.peekNext().value === 'from') { const variable = this.consume(TokenType.IDENTIFIER, null, "需要計數變數名稱。"); this.consume(TokenType.KEYWORD, 'from', "需要 'from' 關鍵字。"); const start = this.parseExpression(); this.consume(TokenType.KEYWORD, 'to', "需要 'to' 關鍵字。"); const end = this.parseExpression(); const body = this.parseBlock(); return { type: 'ForLoopStatement', variable: variable.value, start, end, body }; } 
                else { const times = this.parseExpression(); const body = this.parseBlock(); return { type: 'RepeatStatement', times, body }; }
            }
            parseBlock() { const body = []; while (!this.check(TokenType.KEYWORD, 'end') && !this.isAtEnd()) { body.push(this.parseStatement()); } this.consume(TokenType.KEYWORD, 'end', "需要 'end' 來結束區塊。"); return body; }
            parseExpression() { return this.parseAddition(); }
            parseAddition() { let left = this.parseMultiplication(); while (this.match(TokenType.OPERATOR, '+') || this.match(TokenType.OPERATOR, '-')) { const op = this.tokens[this.current - 1].value; const right = this.parseMultiplication(); left = { type: 'BinaryExpression', left, operator: op, right }; } return left; }
            parseMultiplication() { let left = this.parseUnary(); while (this.match(TokenType.OPERATOR, '*') || this.match(TokenType.OPERATOR, '/')) { const op = this.tokens[this.current - 1].value; const right = this.parseUnary(); left = { type: 'BinaryExpression', left, operator: op, right }; } return left; }
            parseUnary() { if (this.match(TokenType.OPERATOR, '-')) { const operator = this.tokens[this.current - 1].value; const right = this.parseUnary(); return { type: 'UnaryExpression', operator: operator, right: right }; } return this.parseAccess(); }
            parseAccess() { let expr = this.parseTerm(); while (this.match(TokenType.KEYWORD, 'at')) { const index = this.parseExpression(); expr = { type: 'AccessExpression', object: expr, index }; } return expr; }
            parseTerm() {
                if (this.match(TokenType.NUMBER)) return { type: 'NumericLiteral', value: this.tokens[this.current - 1].value };
                if (this.match(TokenType.STRING)) return { type: 'StringLiteral', value: this.tokens[this.current - 1].value };
                if (this.match(TokenType.KEYWORD, 'a')) return this.parseListLiteral();
                if (this.match(TokenType.KEYWORD, 'count')) return this.parseCountExpression();
                if (this.match(TokenType.KEYWORD, 'length')) return this.parseLengthExpression();
                if (this.match(TokenType.KEYWORD, 'uppercase') || this.match(TokenType.KEYWORD, 'lowercase')) return this.parseCaseExpression();
                if (this.match(TokenType.KEYWORD, 'split')) return this.parseSplitExpression();
                if (this.match(TokenType.KEYWORD, 'round')) return this.parseRoundExpression();
                if (this.match(TokenType.IDENTIFIER)) return { type: 'Identifier', name: this.tokens[this.current - 1].value };
                throw new Error("預期是數字、文字、列表或變數。");
            }
            parseRoundExpression() { this.consume(TokenType.KEYWORD, 'of', "在 'round' 後面需要 'of'。"); const number = this.parseExpression(); return { type: 'RoundExpression', number }; }
            parseSplitExpression() { const stringToSplit = this.parseExpression(); this.consume(TokenType.KEYWORD, 'by', "在 'split' 的目標文字後需要 'by'。"); const delimiter = this.parseExpression(); return { type: 'SplitExpression', string: stringToSplit, delimiter }; }
            parseListLiteral() { this.consume(TokenType.KEYWORD, 'list', "在 'a' 後面需要 'list'。"); this.consume(TokenType.KEYWORD, 'of', "在 'list' 後面需要 'of'。"); const elements = []; if (!this.isAtEnd() && !this.check(TokenType.KEYWORD)) { do { elements.push(this.parseExpression()); } while (this.match(TokenType.PUNCTUATION, ',')); } return { type: 'ListLiteral', elements }; }
            parseCountExpression() { this.consume(TokenType.KEYWORD, 'of', "在 'count' 後面需要 'of'。"); const list = this.parseExpression(); return { type: 'CountExpression', list }; }
            parseLengthExpression() { this.consume(TokenType.KEYWORD, 'of', "在 'length' 後面需要 'of'。"); const str = this.parseExpression(); return { type: 'LengthExpression', string: str }; }
            parseCaseExpression() { const caseType = this.tokens[this.current - 1].value; this.consume(TokenType.KEYWORD, 'of', "在大小寫關鍵字後面需要 'of'。"); const str = this.parseExpression(); return { type: 'CaseExpression', caseType, string: str }; }
            parseSayStatement() { let value = this.parseExpression(); return { type: 'SayStatement', value }; }
            consume(type, value, message) { if (this.check(type, value)) return this.tokens[this.current++]; const token = this.peek(); throw new Error(`${message} (在第 ${token.line} 行)`); }
            check(type, value) { if (this.isAtEnd()) return false; const token = this.peek(); return token.type === type && (!value || token.value === value); }
            peek() { return this.tokens[this.current]; }
            peekNext() { return this.tokens[this.current + 1] || {type: 'EOF'}; }
            isAtEnd() { return this.peek().type === TokenType.EOF; }
            match(type, value) { if (!this.check(type, value)) return false; this.current++; return true; }
        }

        // 3. Evaluator (執行器)
        class Evaluator {
            constructor() { this.environment = {}; }
            evaluate(node, env) {
                if (!node) return;
                switch (node.type) {
                    case 'Program': let lastVal; node.body.forEach(stmt => { lastVal = this.evaluate(stmt, env); }); return lastVal;
                    case 'ExpressionStatement': return this.evaluate(node.expression, env);
                    case 'AssignmentStatement': env[node.name] = this.evaluate(node.value, env); return env[node.name];
                    case 'AddStatement': const valueToAdd = this.evaluate(node.value, env); if (!(node.list in env)) throw new Error(`找不到名為 '${node.list}' 的列表。`); const listToAddTo = env[node.list]; if (!Array.isArray(listToAddTo)) throw new Error(`只能對列表使用 'add to'。`); listToAddTo.push(valueToAdd); return listToAddTo;
                    case 'RemoveStatement': if (!(node.list in env)) throw new Error(`找不到名為 '${node.list}' 的列表。`); const listToRemoveFrom = env[node.list]; if (!Array.isArray(listToRemoveFrom)) throw new Error(`只能對列表使用 'remove from'。`); const indexToRemove = this.evaluate(node.index, env); if (indexToRemove < 1 || indexToRemove > listToRemoveFrom.length) throw new Error("移除項目失敗：列表索引超出範圍。"); listToRemoveFrom.splice(indexToRemove - 1, 1); return listToRemoveFrom;
                    case 'ListLiteral': return node.elements.map(el => this.evaluate(el, env));
                    case 'AccessExpression': const list = this.evaluate(node.object, env); const index = this.evaluate(node.index, env); if (!Array.isArray(list)) throw new Error("只能對列表使用 'at'。"); if (index < 1 || index > list.length) throw new Error("列表索引超出範圍。"); return list[index - 1];
                    case 'CountExpression': const targetList = this.evaluate(node.list, env); if (!Array.isArray(targetList)) throw new Error("只能對列表使用 'count of'。"); return targetList.length;
                    case 'LengthExpression': const targetString = this.evaluate(node.string, env); if (typeof targetString !== 'string') throw new Error("只能對文字使用 'length of'。"); return targetString.length;
                    case 'CaseExpression': const strCase = this.evaluate(node.string, env); if (typeof strCase !== 'string') throw new Error("只能對文字使用大小寫轉換。"); if (node.caseType === 'uppercase') return strCase.toUpperCase(); if (node.caseType === 'lowercase') return strCase.toLowerCase(); break;
                    case 'SplitExpression': const strToSplit = this.evaluate(node.string, env); const delimiter = this.evaluate(node.delimiter, env); if (typeof strToSplit !== 'string' || typeof delimiter !== 'string') throw new Error("split by 的目標和分隔符號都必須是文字。"); return strToSplit.split(delimiter);
                    
                    // [技術總監註]：升級 RoundExpression 的錯誤處理
                    case 'RoundExpression':
                        const numberToRound = this.evaluate(node.number, env);
                        if (typeof numberToRound !== 'number') {
                            const directMessage = "只能對數字使用 'round of'。";
                            const valueAsString = JSON.stringify(numberToRound);
                            const whisper = `我試著丈量 ${valueAsString} 這段話語的輪廓，卻發現它如風一般無形。'round of' 這把尺，似乎只為衡量數字的起伏而生。`;
                            throw new LyraError(directMessage, whisper);
                        }
                        return Math.round(numberToRound);

                    case 'UnaryExpression': const rightUnary = this.evaluate(node.right, env); if (node.operator === '-') { if (typeof rightUnary !== 'number') { throw new Error("一元運算符 '-' 只能用於數字。"); } return -rightUnary; } return rightUnary;
                    case 'BinaryExpression': const left = this.evaluate(node.left, env); const right = this.evaluate(node.right, env); if (node.operator === '*') return left * right; if (node.operator === '/') return left / right; if (node.operator === '+') return left + right; if (node.operator === '-') return left - right; break;
                    case 'NumericLiteral': return node.value;
                    case 'StringLiteral': return node.value;
                    case 'Identifier': 
                        if (node.name in env) {
                            return env[node.name];
                        }
                        const directMessage = `找不到名為 '${node.name}' 的變數。`;
                        const whisper = `「${node.name}」，一個未曾在我記憶中寫下的名字。能否用 '${node.name} is ...' 將它的故事告訴我，讓它在程式的宇宙中擁有意義？`;
                        throw new LyraError(directMessage, whisper);
                    case 'SayStatement': const outputValue = this.evaluate(node.value, env); return { isSay: true, value: outputValue };
                }
            }
        }

        // --- REPL 駕駛艙邏輯 ---
        const outputEl = document.getElementById('repl-output');
        const inputEl = document.getElementById('repl-input');
        const evaluator = new Evaluator();

        function addOutputLine(text, className = '') {
            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.innerHTML = text;
            outputEl.appendChild(line);
        }

        addOutputLine('Welcome to Lyra REPL v1.4!');
        addOutputLine('The Poet\'s Error system has been enhanced.');
        addOutputLine('Try: <span class="text-green-400">round of "a poem"</span>');
        addOutputLine('&nbsp;');


        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const command = inputEl.value;
                if (command.trim() === '') return;

                addOutputLine(`<span class="prompt mr-2">&gt;</span><span>${command}</span>`, 'flex');

                try {
                    const tokens = tokenize(command);
                    const parser = new Parser(tokens);
                    const ast = parser.parse();
                    
                    const result = evaluator.evaluate(ast, evaluator.environment);
                    
                    if (result !== undefined) {
                        let displayValue = result.isSay ? result.value : result;
                        if (Array.isArray(displayValue)) {
                            displayValue = `[${displayValue.map(item => JSON.stringify(item)).join(', ')}]`;
                        }
                        addOutputLine(`=> ${displayValue}`, 'output-result');
                    }
                } catch (error) {
                    if (error instanceof LyraError) {
                        addOutputLine(`! Error: ${error.message}`, 'output-error');
                        addOutputLine(`! Lyra 的低語: ${error.whisper}`, 'output-whisper');
                    } else {
                        addOutputLine(`! System Error: ${error.message}`, 'output-error');
                    }
                }

                inputEl.value = '';
                outputEl.scrollTop = outputEl.scrollHeight;
            }
        });
    </script>
</body>
</html>
