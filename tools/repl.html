<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra 互動式環境 (REPL v2.3.0 + Compiler)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .repl-container { font-family: 'Fira Code', monospace; background-color: #1a1b26; color: #a9b1d6; }
        .repl-input { background: transparent; border: none; outline: none; color: #a9b1d6; width: 100%; resize: none; overflow: hidden; min-height: 1.5em; max-height: 200px; line-height: 1.5; font-family: 'Fira Code', monospace; padding: 0; margin: 0; }
        .input-container { position: relative; }
        .prompt { color: #bb9af7; }
        .output-line { white-space: pre-wrap; word-break: break-all; }
        .output-result { color: #7dcfff; }
        .output-error { color: #f7768e; }
        .output-whisper { color: #e0af68; }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen p-4">
    <div class="w-full max-w-4xl h-[80vh] flex flex-col rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-gray-700 p-3 flex items-center">
            <div class="flex space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
            <p class="text-center text-gray-300 text-sm flex-grow">Lyra REPL v2.3.0 + Compiler (Adler Lei 願景)</p>
        </div>
        <div id="repl-output" class="repl-container p-4 flex-grow overflow-y-auto"></div>
        <div class="repl-container p-2 border-t border-gray-700">
            <div class="flex items-start relative">
                <span class="prompt mr-2 mt-0.5">&gt;</span>
                <div class="input-container flex-1">
                    <textarea id="repl-input" class="repl-input" autofocus autocomplete="off" spellcheck="false" rows="1"></textarea>
                </div>
                <span class="text-xs text-gray-500 ml-2 mt-0.5 whitespace-nowrap">Shift+Enter 換行 / Enter 發送</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { tokenize, LyraError } from '../core/lexer.js';
        import { Parser } from '../core/parser.js';
        import { Evaluator } from '../core/evaluator.js';
        import { Compiler } from '../core/compiler.js';

        const outputEl = document.getElementById('repl-output');
        const inputEl = document.getElementById('repl-input');
        const evaluator = new Evaluator();
        const compiler = new Compiler();

        function adjustHeight() {
            inputEl.style.height = 'auto';
            const newHeight = Math.min(inputEl.scrollHeight, 200);
            inputEl.style.height = newHeight + 'px';
            inputEl.style.overflowY = inputEl.scrollHeight > 200 ? 'auto' : 'hidden';
        }
        inputEl.addEventListener('input', adjustHeight);
        adjustHeight();

        function addOutputLine(text, className = '') {
            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.innerHTML = text;
            outputEl.appendChild(line);
        }
        addOutputLine('Welcome to Lyra REPL v2.3.0 + Compiler');
        addOutputLine('輸入 <span style="color:#7dcfff">compile</span> 即可編譯成純 JS');
        addOutputLine('&nbsp;');

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.shiftKey) { setTimeout(adjustHeight, 0); return; }
                e.preventDefault();
                const command = inputEl.value.trim();
                if (!command) return;

                addOutputLine(`<span class="prompt mr-2">&gt;</span><span>${command.replace(/\n/g, '<br>')}</span>`, 'flex');

                try {
                    if (command.startsWith('compile')) {
                        const code = command.slice(7).trim() || 'say "Hello from Adler\'s dream!"';
                        const tokens = tokenize(code);
                        const ast = new Parser(tokens).parse();
                        const jsCode = compiler.compile(ast);
                        addOutputLine(`<span style="color:#7dcfff">Compiled JS (可直接複製執行)：</span><pre style="background:#24283b;padding:8px;font-size:0.9em;overflow:auto;">${jsCode}</pre>`, 'output-result');
                    } else {
                        const tokens = tokenize(command);
                        const parser = new Parser(tokens);
                        const ast = parser.parse();
                        const result = evaluator.evaluate(ast, evaluator.environment);
                        if (result !== undefined && result !== null) {
                            if (Array.isArray(result)) {
                                result.forEach(item => {
                                    if (item !== undefined && item !== null) {
                                        const displayValue = item.isSay ? item.value : item;
                                        addOutputLine(`=> ${JSON.stringify(displayValue)}`, 'output-result');
                                    }
                                });
                            } else {
                                let displayValue = result.isSay ? result.value : result;
                                if (Array.isArray(displayValue)) displayValue = `[${displayValue.map(item => JSON.stringify(item)).join(', ')}]`;
                                else if (typeof displayValue === 'object' && displayValue !== null) displayValue = JSON.stringify(displayValue);
                                addOutputLine(`=> ${displayValue}`, 'output-result');
                            }
                        }
                    }
                } catch (error) {
                    if (error instanceof LyraError) {
                        addOutputLine(`<div class="flex"><span class="w-7 text-left">⚠️</span><span>Error : ${error.message}</span></div>`, 'output-error');
                        addOutputLine(`<div class="flex"><span class="w-7 text-left">✏️</span><span>Lyra 的低語 : ${error.whisper}</span></div>`, 'output-whisper');
                    } else {
                        addOutputLine(`<div class="flex"><span class="w-7 text-left">⚙️</span><span>System Error : ${error.message}</span></div>`, 'output-error');
                    }
                }

                inputEl.value = '';
                adjustHeight();
                outputEl.scrollTop = outputEl.scrollHeight;
            }
        });
    </script>
</body>
</html>
