<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra 互動式環境 (REPL v2.2.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .repl-container {
            font-family: 'Fira Code', monospace;
            background-color: #1a1b26;
            color: #a9b1d6;
        }
        .repl-input {
            background: transparent;
            border: none;
            outline: none;
            color: #a9b1d6;
            width: 100%;
            resize: none;
            overflow: hidden;
            min-height: 1.5em;
            max-height: 200px;
            line-height: 1.5;
            font-family: 'Fira Code', monospace;
            padding: 0;
            margin: 0;
        }
        .input-container {
            position: relative;
        }
        .input-hint {
            position: absolute;
            bottom: -20px;
            right: 0;
            font-size: 10px;
            color: #565f89;
            pointer-events: none;
            opacity: 0.7;
        }
        .prompt {
            color: #bb9af7;
        }
        .output-line {
            white-space: pre-wrap;
            word-break: break-all;
        }
        .output-result {
            color: #7dcfff;
        }
        .output-error {
            color: #f7768e;
        }
        .output-whisper {
            color: #e0af68;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen p-4">

    <div class="w-full max-w-4xl h-[80vh] flex flex-col rounded-2xl shadow-2xl overflow-hidden">
        <div class="bg-gray-700 p-3 flex items-center">
            <div class="flex space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
            <p class="text-center text-gray-300 text-sm flex-grow">Lyra REPL v2.2.0 - terminal Emulator</p>
        </div>

        <div id="repl-output" class="repl-container p-4 flex-grow overflow-y-auto">
            <!-- 初始歡迎訊息會由 JS 動態加入 -->
        </div>
        <div class="repl-container p-2 border-t border-gray-700">
            <div class="flex items-start relative">
                <span class="prompt mr-2 mt-0.5">&gt;</span>
                <div class="input-container flex-1">
                    <textarea id="repl-input" class="repl-input" autofocus autocomplete="off" spellcheck="false" rows="1"></textarea>
                </div>
                <span class="text-xs text-gray-500 ml-2 mt-0.5 whitespace-nowrap">Shift + Enter 換行 / Enter 發送</span>
            </div>
        </div>
    </div>

    <script type="module">
        // --- 引擎：Lyra Core Engine ---

        class LyraError extends Error {
            constructor(directMessage, whisper) {
                super(directMessage);
                this.name = 'LyraError';
                this.whisper = whisper;
            }
        }

        // 1. Lexer (詞法分析器)
        const TokenType = { KEYWORD: '關鍵字', IDENTIFIER: '識別符', STRING: '文字', NUMBER: '數字', OPERATOR: '運算符', PUNCTUATION: '標點符號', EOF: '檔案結尾', INTERP_START: '內嵌開始', INTERP_END: '內嵌結束' };
        const KEYWORDS = {'define': 1, 'say': 1, 'when': 1, 'else': 1, 'end': 1, 'is': 1, 'repeat': 1, 'from': 1, 'to': 1, 'a': 1, 'list': 1, 'of': 1, 'at': 1, 'for': 1, 'each': 1, 'in': 1, 'count': 1, 'add': 1, 'remove': 1, 'item': 1, 'length': 1, 'uppercase': 1, 'lowercase': 1, 'split': 1, 'by': 1, 'round': 1, 'times': 1};
        class Token { constructor(type, value, line) { this.type = type; this.value = value; this.line = line; } }
        
        function tokenize(code) {
            const tokens = [];
            let current = 0;
            let line = 1;
            while (current < code.length) {
                let char = code[current];
                if (/\s/.test(char)) { if (char === '\n') line++; current++; continue; }
                if (char === '#') { while (current < code.length && code[current] !== '\n') current++; continue; }
                
                if (char === '"' || char === "'") {
                    const quoteType = char;
                    const startLine = line;
                    current++;
                    let value = '';
                    while (current < code.length && code[current] !== quoteType) {
                        const otherQuote = quoteType === '"' ? "'" : '"';
                        if (code[current] === otherQuote) {
                            const directMessage = `字串引號不匹配。`;
                            const whisper = `故事以 ${quoteType} 開篇，卻想用 ${otherQuote} 結尾，這讓詩句的節奏錯亂了。請用同一個符號來擁抱這段文字。`;
                            throw new LyraError(`${directMessage} (在第 ${line} 行)`, whisper);
                        }
                        if (code[current] === '{' && (code[current-1] !== '\\')) {
                            if (value.length > 0) tokens.push(new Token(TokenType.STRING, value, startLine));
                            value = '';
                            tokens.push(new Token(TokenType.INTERP_START, '{', startLine));
                            current++;
                            let brace_level = 1;
                            let expr_code = '';
                            while(current < code.length && brace_level > 0) {
                                if (code[current] === '{') brace_level++;
                                if (code[current] === '}') brace_level--;
                                if(brace_level > 0) expr_code += code[current];
                                current++;
                            }
                            if (brace_level > 0) {
                                 const directMessage = `未閉合的字串內嵌。`;
                                 const whisper = `在文字的風景中，我看見一個敞開的 {，它在等待一個 } 來讓風景完整。`;
                                 throw new LyraError(`${directMessage} (從第 ${startLine} 行開始)`, whisper);
                            }
                            const inner_tokens = tokenize(expr_code).filter(t => t.type !== TokenType.EOF);
                            tokens.push(...inner_tokens);
                            tokens.push(new Token(TokenType.INTERP_END, '}', line));
                        } else {
                            if (code[current] === '\n') line++;
                            value += code[current];
                            current++;
                        }
                    }
                    if (current >= code.length) {
                        const directMessage = `未閉合的字串。`;
                        const whisper = `這段文字以 ${quoteType} 開啟了它的故事，卻似乎忘了用同一個符號來畫上句點。`;
                        throw new LyraError(`${directMessage} (從第 ${startLine} 行開始)`, whisper);
                    }
                    if (value.length > 0) tokens.push(new Token(TokenType.STRING, value, line));
                    current++;
                    continue;
                }

                if (char === '(' || char === ')' || char === ',') { tokens.push(new Token(TokenType.PUNCTUATION, char, line)); current++; continue; }
                
                // 添加比較運算符支援
                if (char === '>' || char === '<' || char === '=' || char === '!') {
                    let op = char;
                    current++;
                    if (current < code.length && code[current] === '=') {
                        op += '=';
                        current++;
                    }
                    tokens.push(new Token(TokenType.OPERATOR, op, line));
                    continue;
                }
                
                if (/[+\-*/]/.test(char)) { tokens.push(new Token(TokenType.OPERATOR, char, line)); current++; continue; }
                if (/\d/.test(char)) { let value = ''; while (current < code.length && /[0-9.]/.test(code[current])) { value += code[current]; current++; } tokens.push(new Token(TokenType.NUMBER, parseFloat(value), line)); continue; }
                
                // [技術總監註]：升級識別符邏輯，以處理無效的變數命名
                if (/[a-zA-Z_]/.test(char)) {
                    let value = '';
                    while (current < code.length && /[a-zA-Z0-9_]/.test(code[current])) {
                        value += code[current];
                        current++;
                    }
                    // 檢查下一個字元是否為連字號 '-'
                    if (current < code.length && code[current] === '-') {
                        const directMessage = `無效的變數名稱。`;
                        const whisper = `變數的名字裡不能包含 '-' 符號，它會讓我想起減法。也許，溫柔的底線 '_' 會是更好的連結？`;
                        throw new LyraError(`${directMessage} (在第 ${line} 行)`, whisper);
                    }
                    const type = KEYWORDS[value] ? TokenType.KEYWORD : TokenType.IDENTIFIER;
                    tokens.push(new Token(type, value, line));
                    continue;
                }

                throw new Error(`無法識別的字元 '${char}' 在第 ${line} 行。`);
            }
            tokens.push(new Token(TokenType.EOF, 'EOF', line));
            return tokens;
        }

        // 2. Parser (語法分析器)
        class Parser {
            constructor(tokens) {
                this.tokens = tokens;
                this.current = 0;
                this.commandKeywords = ['say', 'repeat', 'add', 'remove', 'round', 'count', 'length', 'split', 'uppercase', 'lowercase', 'when', 'define', 'is', 'for', 'each', 'in'];
            }
            levenshtein(a, b) { const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null)); for (let i = 0; i <= a.length; i += 1) { matrix[0][i] = i; } for (let j = 0; j <= b.length; j += 1) { matrix[j][0] = j; } for (let j = 1; j <= b.length; j += 1) { for (let i = 1; i <= a.length; i += 1) { const indicator = a[i - 1] === b[j - 1] ? 0 : 1; matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + indicator,); } } return matrix[b.length][a.length]; }
            findSimilarKeyword(word) { let minDistance = Infinity; let suggestion = null; for (const keyword of this.commandKeywords) { const distance = this.levenshtein(word.toLowerCase(), keyword); if (distance <= 2 && distance < minDistance) { minDistance = distance; suggestion = keyword; } } return suggestion; }
            parse() { const stmts = []; while (!this.isAtEnd()) { stmts.push(this.parseStatement()); } return { type: 'Program', body: stmts }; }
            parseStatement() {
                if (this.check(TokenType.IDENTIFIER) && this.peekNext().value === 'is') return this.parseAssignmentStatement();
                if (this.match(TokenType.KEYWORD, 'say')) return this.parseSayStatement();
                if (this.match(TokenType.KEYWORD, 'when')) return this.parseWhenStatement();
                if (this.match(TokenType.KEYWORD, 'repeat')) return this.parseRepeatStatement();
                if (this.match(TokenType.KEYWORD, 'add')) return this.parseAddStatement();
                if (this.match(TokenType.KEYWORD, 'remove')) return this.parseRemoveStatement();
                if (this.check(TokenType.IDENTIFIER)) { const potentialTypo = this.peek().value; const suggestion = this.findSimilarKeyword(potentialTypo); if (suggestion) { const directMessage = `我不認識 '${potentialTypo}' 這個指令。`; const whisper = `我猜，你是不是想寫 '${suggestion}'？光影搖曳，字詞有時也會跳錯舞步。`; throw this.createParseError(directMessage, whisper); } }
                return this.parseExpressionStatement();
            }
            
            parseWhenStatement() {
                const condition = this.parseComparison();
                const thenBody = this.parseBlock();
                
                const elseIfBranches = [];
                let elseBody = null;
                
                // 處理 else when 分支
                while (this.match(TokenType.KEYWORD, 'else')) {
                    if (this.match(TokenType.KEYWORD, 'when')) {
                        // else when 分支
                        const elseIfCondition = this.parseComparison();
                        const elseIfBody = this.parseBlock();
                        elseIfBranches.push({
                            condition: elseIfCondition,
                            body: elseIfBody
                        });
                    } else {
                        // 純 else 分支
                        elseBody = this.parseBlock();
                        break; // else 必須是最後一個分支
                    }
                }
                
                this.consume(TokenType.KEYWORD, 'end', "需要 'end' 來結束 when 語句。");
                
                return {
                    type: 'WhenStatement',
                    condition,
                    thenBody,
                    elseIfBranches,
                    elseBody
                };
            }

            // 添加比較表達式解析
            parseComparison() {
                let left = this.parseAddition();
                
                while (this.match(TokenType.OPERATOR, '>') || 
                       this.match(TokenType.OPERATOR, '<') || 
                       this.match(TokenType.OPERATOR, '>=') || 
                       this.match(TokenType.OPERATOR, '<=') || 
                       this.match(TokenType.OPERATOR, '==') || 
                       this.match(TokenType.OPERATOR, '!=')) {
                    const operator = this.tokens[this.current - 1].value;
                    const right = this.parseAddition();
                    left = {
                        type: 'ComparisonExpression',
                        left,
                        operator,
                        right
                    };
                }
                
                return left;
            }
            
            parseTerm() {
                // 新增：處理括號表達式
                if (this.match(TokenType.PUNCTUATION, '(')) {
                    const expr = this.parseExpression();
                    this.consume(TokenType.PUNCTUATION, ')', "在表達式後需要一個 ')' 來閉合括號。");
                    return expr;
                }
                
                if (this.match(TokenType.NUMBER)) return { type: 'NumericLiteral', value: this.tokens[this.current - 1].value };
                if (this.check(TokenType.STRING) || this.check(TokenType.INTERP_START)) {
                    if (this.check(TokenType.STRING) && this.peekNext().type !== TokenType.INTERP_START) {
                        const token = this.tokens[this.current++];
                        return { type: 'StringLiteral', value: token.value };
                    }
                    const parts = [];
                    while (this.check(TokenType.STRING) || this.check(TokenType.INTERP_START)) {
                        if (this.match(TokenType.STRING)) {
                            parts.push(this.tokens[this.current - 1].value);
                        } else if (this.match(TokenType.INTERP_START)) {
                            const expr = this.parseExpression();
                            parts.push(expr);
                            this.consume(TokenType.INTERP_END, null, "字串內嵌需要 '}' 來閉合。");
                        } else {
                            break;
                        }
                    }
                    return { type: 'InterpolatedString', parts };
                }
                if (this.match(TokenType.KEYWORD, 'a')) return this.parseListLiteral();
                if (this.match(TokenType.KEYWORD, 'count')) return this.parseCountExpression();
                if (this.match(TokenType.KEYWORD, 'length')) return this.parseLengthExpression();
                if (this.match(TokenType.KEYWORD, 'uppercase') || this.match(TokenType.KEYWORD, 'lowercase')) return this.parseCaseExpression();
                if (this.match(TokenType.KEYWORD, 'split')) return this.parseSplitExpression();
                if (this.match(TokenType.KEYWORD, 'round')) return this.parseRoundExpression();
                if (this.match(TokenType.IDENTIFIER)) return { type: 'Identifier', name: this.tokens[this.current - 1].value };
                throw this.createParseError("預期是數字、文字、列表或變數。");
            }
            parseExpressionStatement() { const expr = this.parseExpression(); return { type: 'ExpressionStatement', expression: expr }; }
            parseRemoveStatement() { this.consume(TokenType.KEYWORD, 'item', "在 'remove' 後面需要 'item'。"); this.consume(TokenType.KEYWORD, 'at', "在 'item' 後面需要 'at'。"); const index = this.parseExpression(); this.consume(TokenType.KEYWORD, 'from', "在索引後需要 'from'。"); const listName = this.consume(TokenType.IDENTIFIER, null, "在 'from' 後面需要列表名稱。"); return { type: 'RemoveStatement', index, list: listName.value }; }
            parseAddStatement() { const value = this.parseExpression(); this.consume(TokenType.KEYWORD, 'to', "在 'add' 的值後面需要 'to'。"); const listName = this.consume(TokenType.IDENTIFIER, null, "在 'to' 後面需要列表名稱。"); return { type: 'AddStatement', value, list: listName.value }; }
            parseAssignmentStatement() { const name = this.consume(TokenType.IDENTIFIER, null, "需要變數名稱。"); this.consume(TokenType.KEYWORD, 'is', "變數名稱後需要 'is'。"); const value = this.parseExpression(); return { type: 'AssignmentStatement', name: name.value, value }; }
            parseRepeatStatement() {
                if (this.match(TokenType.KEYWORD, 'for')) {
                    this.consume(TokenType.KEYWORD, 'each', "在 'for' 後面需要 'each'。");
                    const variable = this.consume(TokenType.IDENTIFIER, null, "需要項目變數名稱。");
                    this.consume(TokenType.KEYWORD, 'in', "需要 'in' 關鍵字。");
                    const collection = this.parseExpression();
                    const body = this.parseBlock();
                    this.consume(TokenType.KEYWORD, 'end', "需要 'end' 來結束 repeat for each 語句。");
                    return { type: 'ForEachStatement', variable: variable.value, collection, body };
                } else if (this.check(TokenType.IDENTIFIER) && this.peekNext().value === 'from') {
                    // This is an unlisted feature, but we'll make it robust too.
                    const variable = this.consume(TokenType.IDENTIFIER, null, "需要計數變數名稱。");
                    this.consume(TokenType.KEYWORD, 'from', "需要 'from' 關鍵字。");
                    const start = this.parseExpression();
                    this.consume(TokenType.KEYWORD, 'to', "需要 'to' 關鍵字。");
                    const end = this.parseExpression();
                    const body = this.parseBlock();
                    this.consume(TokenType.KEYWORD, 'end', "需要 'end' 來結束 repeat from to 語句。");
                    return { type: 'ForLoopStatement', variable: variable.value, start, end, body };
                } else {
                    const times = this.parseExpression();
                    this.consume(TokenType.KEYWORD, 'times', "在 repeat 的次數後面需要 'times' 關鍵字。");
                    const body = this.parseBlock();
                    this.consume(TokenType.KEYWORD, 'end', "需要 'end' 來結束 repeat times 語句。");
                    return { type: 'RepeatStatement', times, body };
                }
            }
            parseBlock() {
                const body = [];
                while (!this.check(TokenType.KEYWORD, 'end') && 
                       !this.check(TokenType.KEYWORD, 'else') && 
                       !this.isAtEnd()) {
                    body.push(this.parseStatement());
                }
                
                // parseBlock 不消費 end 或 else，讓調用者處理
                return body;
            }
            
            // 修改 parseExpression 方法
            parseExpression() { 
                return this.parseComparison(); 
            }
            
            parseAddition() { let left = this.parseMultiplication(); while (this.match(TokenType.OPERATOR, '+') || this.match(TokenType.OPERATOR, '-')) { const op = this.tokens[this.current - 1].value; const right = this.parseMultiplication(); left = { type: 'BinaryExpression', left, operator: op, right }; } return left; }
            parseMultiplication() { let left = this.parseUnary(); while (this.match(TokenType.OPERATOR, '*') || this.match(TokenType.OPERATOR, '/')) { const op = this.tokens[this.current - 1].value; const right = this.parseUnary(); left = { type: 'BinaryExpression', left, operator: op, right }; } return left; }
            parseUnary() { if (this.match(TokenType.OPERATOR, '-')) { const operator = this.tokens[this.current - 1].value; const right = this.parseUnary(); return { type: 'UnaryExpression', operator: operator, right: right }; } return this.parseAccess(); }
            parseAccess() { let expr = this.parseTerm(); while (this.match(TokenType.KEYWORD, 'at')) { const index = this.parseExpression(); expr = { type: 'AccessExpression', object: expr, index }; } return expr; }
            parseRoundExpression() { this.consume(TokenType.KEYWORD, 'of', "在 'round' 後面需要 'of'。"); if (this.peek().type === TokenType.EOF) { const directMessage = "指令不完整：在 'round of' 後面需要一個數字或變數。"; const whisper = "你輕聲說出 'round of'，像一首詩起了頭，卻遺落了最關鍵的詞。能否補上那個等待被圓滿的數字，讓這句詩完整？"; const prevToken = this.tokens[this.current - 1]; throw new LyraError(`${directMessage} (在第 ${prevToken.line} 行)`, whisper); } const number = this.parseExpression(); return { type: 'RoundExpression', number }; }
            parseSplitExpression() { const stringToSplit = this.parseExpression(); this.consume(TokenType.KEYWORD, 'by', "在 'split' 的目標文字後需要 'by'。"); const delimiter = this.parseExpression(); return { type: 'SplitExpression', string: stringToSplit, delimiter }; }
            parseListLiteral() { this.consume(TokenType.KEYWORD, 'list', "在 'a' 後面需要 'list'。"); this.consume(TokenType.KEYWORD, 'of', "在 'list' 後面需要 'of'。"); const elements = []; if (!this.isAtEnd() && !this.check(TokenType.KEYWORD)) { do { elements.push(this.parseExpression()); } while (this.match(TokenType.PUNCTUATION, ',')); } return { type: 'ListLiteral', elements }; }
            parseCountExpression() { this.consume(TokenType.KEYWORD, 'of', "在 'count' 後面需要 'of'。"); const list = this.parseExpression(); return { type: 'CountExpression', list }; }
            parseLengthExpression() { this.consume(TokenType.KEYWORD, 'of', "在 'length' 後面需要 'of'。"); const str = this.parseExpression(); return { type: 'LengthExpression', string: str }; }
            parseCaseExpression() { const caseType = this.tokens[this.current - 1].value; this.consume(TokenType.KEYWORD, 'of', "在大小寫關鍵字後面需要 'of'。"); const str = this.parseExpression(); return { type: 'CaseExpression', caseType, string: str }; }
            parseSayStatement() { let value = this.parseExpression(); return { type: 'SayStatement', value }; }
            consume(type, value, directMessage, whisper) { if (this.check(type, value)) return this.tokens[this.current++]; throw this.createParseError(directMessage, whisper); }
            createParseError(directMessage, whisper) { const token = this.peek(); const finalDirectMessage = `${directMessage} (在第 ${token.line} 行)`; if (whisper) { return new LyraError(finalDirectMessage, whisper); } const genericWhisper = `我看見「${token.value}」在這裡，但它似乎迷了路。也許，我們可以一起找到它正確的位置。`; return new LyraError(finalDirectMessage, genericWhisper); }
            check(type, value) { if (this.isAtEnd()) return false; const token = this.peek(); return token.type === type && (!value || token.value === value); }
            peek() { return this.tokens[this.current]; }
            peekNext() { return this.tokens[this.current + 1] || {type: 'EOF'}; }
            isAtEnd() { return this.peek().type === TokenType.EOF; }
            match(type, value) { if (!this.check(type, value)) return false; this.current++; return true; }
        }

        // 3. Evaluator (執行器)
        class Evaluator {
            constructor() { this.environment = {}; }
            
            // 添加 isTruthy 方法
            isTruthy(value) {
                if (value === null || value === undefined) return false;
                if (typeof value === 'boolean') return value;
                if (typeof value === 'number') return value !== 0;
                if (typeof value === 'string') return value.length > 0;
                if (Array.isArray(value)) return value.length > 0;
                return true;
            }
            
            evaluate(node, env) {
                if (!node) return;
                try {
                    switch (node.type) {
                        case 'Program': let lastVal; node.body.forEach(stmt => { lastVal = this.evaluate(stmt, env); }); return lastVal;
                        case 'ExpressionStatement': return this.evaluate(node.expression, env);
                        case 'InterpolatedString':
                            let result = '';
                            for (const part of node.parts) {
                                if (typeof part === 'string') { result += part; } 
                                else { result += this.evaluate(part, env); }
                            }
                            return result;
                        case 'StringLiteral': return node.value;
                        case 'AssignmentStatement': env[node.name] = this.evaluate(node.value, env); return env[node.name];
                        
                        case 'RepeatStatement':
                            const repetitions = this.evaluate(node.times, env);
                            if (typeof repetitions !== 'number' || repetitions < 0) {
                                throw this.createRuntimeError("repeat times 的次數必須是一個非負數。");
                            }
                            const results = [];
                            for (let i = 0; i < repetitions; i++) {
                                node.body.forEach(stmt => {
                                    const result = this.evaluate(stmt, env);
                                    if (result !== undefined) {
                                        results.push(result);
                                    }
                                });
                            }
                            return results;
                        
                            case 'ForEachStatement':
                                const collection = this.evaluate(node.collection, env);
                                if (!Array.isArray(collection)) {
                                    throw this.createRuntimeError("只能對列表使用 'repeat for each'。");
                                }
                                const forEachResults = [];
                                for (const item of collection) {
                                    // 為每次迴圈建立一個新的、繼承自外部環境的獨立環境
                                    const loopEnv = Object.create(env);
                                    loopEnv[node.variable] = item; // 將當前項目設置為迴圈變數

                                    node.body.forEach(stmt => {
                                        const result = this.evaluate(stmt, loopEnv);
                                        if (result !== undefined) {
                                            forEachResults.push(result);
                                        }
                                    });
                                }
                                return forEachResults;

                        // 添加 WhenStatement 處理
                        case 'WhenStatement':
                            const conditionResult = this.evaluate(node.condition, env);
                            if (this.isTruthy(conditionResult)) {
                                let lastVal;
                                node.thenBody.forEach(stmt => {
                                    lastVal = this.evaluate(stmt, env);
                                });
                                return lastVal;
                            }
                            
                            // 檢查 else when 分支
                            for (const elseIfBranch of node.elseIfBranches || []) {
                                const elseIfResult = this.evaluate(elseIfBranch.condition, env);
                                if (this.isTruthy(elseIfResult)) {
                                    let lastVal;
                                    elseIfBranch.body.forEach(stmt => {
                                        lastVal = this.evaluate(stmt, env);
                                    });
                                    return lastVal;
                                }
                            }
                            
                            // 最後檢查 else 分支
                            if (node.elseBody) {
                                let lastVal;
                                node.elseBody.forEach(stmt => {
                                    lastVal = this.evaluate(stmt, env);
                                });
                                return lastVal;
                            }
                            break;
                            
                        // 添加 ComparisonExpression 處理
                        case 'ComparisonExpression':
                            const leftVal = this.evaluate(node.left, env);
                            const rightVal = this.evaluate(node.right, env);
                            
                            switch (node.operator) {
                                case '>': return leftVal > rightVal;
                                case '<': return leftVal < rightVal;
                                case '>=': return leftVal >= rightVal;
                                case '<=': return leftVal <= rightVal;
                                case '==': return leftVal == rightVal;
                                case '!=': return leftVal != rightVal;
                                default: throw this.createRuntimeError(`未知的比較運算符: ${node.operator}`);
                            }
                        
                        case 'AddStatement': const valueToAdd = this.evaluate(node.value, env); if (!(node.list in env)) throw this.createRuntimeError(`找不到名為 '${node.list}' 的列表。`); const listToAddTo = env[node.list]; if (!Array.isArray(listToAddTo)) throw this.createRuntimeError(`只能對列表使用 'add to'。`); listToAddTo.push(valueToAdd); return listToAddTo;
                        case 'RemoveStatement': if (!(node.list in env)) throw this.createRuntimeError(`找不到名為 '${node.list}' 的列表。`); const listToRemoveFrom = env[node.list]; if (!Array.isArray(listToRemoveFrom)) throw this.createRuntimeError(`只能對列表使用 'remove from'。`); const indexToRemove = this.evaluate(node.index, env); if (indexToRemove < 1 || indexToRemove > listToRemoveFrom.length) throw this.createRuntimeError("移除項目失敗：列表索引超出範圍。"); listToRemoveFrom.splice(indexToRemove - 1, 1); return listToRemoveFrom;
                        case 'ListLiteral': return node.elements.map(el => this.evaluate(el, env));
                        case 'AccessExpression': const list = this.evaluate(node.object, env); const index = this.evaluate(node.index, env); if (!Array.isArray(list)) throw this.createRuntimeError("只能對列表使用 'at'。"); if (index < 1 || index > list.length) throw this.createRuntimeError("列表索引超出範圍。"); return list[index - 1];
                        case 'CountExpression': const targetList = this.evaluate(node.list, env); if (!Array.isArray(targetList)) throw this.createRuntimeError("只能對列表使用 'count of'。"); return targetList.length;
                        case 'LengthExpression': const targetString = this.evaluate(node.string, env); if (typeof targetString !== 'string') throw this.createRuntimeError("只能對文字使用 'length of'。"); return targetString.length;
                        case 'CaseExpression': const strCase = this.evaluate(node.string, env); if (typeof strCase !== 'string') throw this.createRuntimeError("只能對文字使用大小寫轉換。"); if (node.caseType === 'uppercase') return strCase.toUpperCase(); if (node.caseType === 'lowercase') return strCase.toLowerCase(); break;
                        case 'SplitExpression': const strToSplit = this.evaluate(node.string, env); const delimiter = this.evaluate(node.delimiter, env); if (typeof strToSplit !== 'string' || typeof delimiter !== 'string') throw this.createRuntimeError("split by 的目標和分隔符號都必須是文字。"); return strToSplit.split(delimiter);
                        case 'RoundExpression': const numberToRound = this.evaluate(node.number, env); if (typeof numberToRound !== 'number') { const valueAsString = JSON.stringify(numberToRound); throw this.createRuntimeError( "只能對數字使用 'round of'。", `我試著丈量 ${valueAsString} 這段話語的輪廓，卻發現它如風一般無形。'round of' 這把尺，似乎只為衡量數字的起伏而生。` ); } return Math.round(numberToRound);
                        case 'UnaryExpression': const rightUnary = this.evaluate(node.right, env); if (node.operator === '-') { if (typeof rightUnary !== 'number') { throw this.createRuntimeError("一元運算符 '-' 只能用於數字。"); } return -rightUnary; } return rightUnary;
                        case 'BinaryExpression': const left = this.evaluate(node.left, env); const right = this.evaluate(node.right, env); if (node.operator === '*') return left * right; if (node.operator === '/') return left / right; if (node.operator === '+') return left + right; if (node.operator === '-') return left - right; break;
                        case 'NumericLiteral': return node.value;
                        case 'Identifier': if (node.name in env) return env[node.name]; throw this.createRuntimeError( `找不到名為 '${node.name}' 的變數。`, `「${node.name}」，一個未曾在我記憶中寫下的名字。能否用 '${node.name} is ...' 將它的故事告訴我，讓它在程式的宇宙中擁有意義？` );
                        case 'SayStatement': const outputValue = this.evaluate(node.value, env); return { isSay: true, value: outputValue };
                    }
                } catch (error) {
                    if (error instanceof LyraError) throw error; 
                    throw this.createRuntimeError(error.message);
                }
            }
            createRuntimeError(directMessage, whisper) {
                const finalWhisper = whisper || "在執行的瞬間，一陣迷霧升起。有些事情超出了我的預期。";
                return new LyraError(directMessage, finalWhisper);
            }
        }

        // --- REPL 駕駛艙邏輯 ---
        const outputEl = document.getElementById('repl-output');
        const inputEl = document.getElementById('repl-input');
        const evaluator = new Evaluator();
        
        // 自動調整 textarea 高度
        function adjustHeight() {
            inputEl.style.height = 'auto';
            const newHeight = Math.min(inputEl.scrollHeight, 200); // 最大高度 200px
            inputEl.style.height = newHeight + 'px';
            
            // 如果內容超過最大高度，顯示滾動條
            if (inputEl.scrollHeight > 200) {
                inputEl.style.overflowY = 'auto';
            } else {
                inputEl.style.overflowY = 'hidden';
            }
        }
        
        inputEl.addEventListener('input', adjustHeight);
        
        // 初始調整高度
        adjustHeight();
        
        function addOutputLine(text, className = '') {
            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.innerHTML = text;
            outputEl.appendChild(line);
        }
        addOutputLine('Welcome to Lyra REPL v2.2.0!');
        addOutputLine('Lyra Terminal Playground , try it and have fun!');
        addOutputLine('Try: <span class="text-green-400">when 5 > 3 say "Hello" end</span>');
        addOutputLine('&nbsp;');
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Shift + Enter: 換行
                    // 不阻止默認行為，讓瀏覽器自然換行
                    setTimeout(() => adjustHeight(), 0);
                } else {
                    // Enter: 執行代碼
                    e.preventDefault();
                    const command = inputEl.value;
                    if (command.trim() === '') return;
                    
                    addOutputLine(`<span class="prompt mr-2">&gt;</span><span>${command.replace(/\n/g, '<br>')}</span>`, 'flex');
                    
                    try {
                        const tokens = tokenize(command);
                        const parser = new Parser(tokens);
                        const ast = parser.parse();
                        const result = evaluator.evaluate(ast, evaluator.environment);

                        if (result !== undefined && result !== null) {
                            // 新增：處理陣列結果 (來自 repeat 迴圈)
                            if (Array.isArray(result)) {
                                result.forEach(item => {
                                    if (item !== undefined && item !== null) {
                                        const displayValue = item.isSay ? item.value : item;
                                        addOutputLine(`=> ${JSON.stringify(displayValue)}`, 'output-result');
                                    }
                                });
                            } else {
                                // 維持原有邏輯處理單一結果
                                let displayValue = result.isSay ? result.value : result;
                                if (Array.isArray(displayValue)) {
                                     displayValue = `[${displayValue.map(item => JSON.stringify(item)).join(', ')}]`;
                                } else if (typeof displayValue === 'object' && displayValue !== null) {
                                    displayValue = JSON.stringify(displayValue);
                                }
                                addOutputLine(`=> ${displayValue}`, 'output-result');
                            }
                        }
                    } catch (error) {
                        if (error instanceof LyraError) {
                            const errorLineHTML = `<div class="flex"><span class="w-7 text-left">⚠️</span><span>Error : ${error.message}</span></div>`;
                            addOutputLine(errorLineHTML, 'output-error');
                            const whisperLineHTML = `<div class="flex"><span class="w-7 text-left">✏️</span><span>Lyra 的低語 : ${error.whisper}</span></div>`;
                            addOutputLine(whisperLineHTML, 'output-whisper');
                        } else {
                            const systemErrorLineHTML = `<div class="flex"><span class="w-7 text-left">⚙️</span><span>System Error : ${error.message}</span></div>`;
                            addOutputLine(systemErrorLineHTML, 'output-error');
                        }
                    }
                    
                    inputEl.value = '';
                    adjustHeight(); // 重置高度
                    outputEl.scrollTop = outputEl.scrollHeight;
                }
            }
        });
    </script>
</body>
